# Continuous integration — typecheck + test on every push and PR.
#
# This is the fast gate that runs on every change. Publishing has its own
# workflow (release.yml) that runs on push to main via changesets/action.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only checkout is all CI needs.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Build workspace packages first so the server's typecheck can resolve
      # beds24-sdk-client + beds24-knowledge types from their dist/.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: |
          # Bun exits with code 1 when open handles remain after all tests pass
          # (known issue with @huggingface/transformers native bindings on Linux).
          # Accept exit code 1 if the summary shows 0 failures; propagate anything else.
          set +e
          bun test --isolate 2>&1 | tee /tmp/bun-test.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 1 ] && grep -q "0 fail" /tmp/bun-test.log; then
            echo "All tests passed (exit code 1 from open handles, not test failures)"
            exit 0
          fi
          exit "$code"
