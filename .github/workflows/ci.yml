# Continuous integration — typecheck + test on every push and PR.
#
# This is the fast gate that runs on every change. Publishing has its own
# workflow (publish.yml) that runs on tags.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only checkout is all CI needs.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
