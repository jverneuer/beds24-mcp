# Publish a new release to npm.
#
# Trigger: push a semver tag, e.g. `git tag v1.1.6 && git push origin v1.1.6`.
#
# This is a 3-package npm-workspace monorepo. The root package is private and
# is NOT published. On a tag we publish the three public workspace packages:
#
#   - beds24-sdk-client    (typed V2 API client, schema introspection, validation)
#   - beds24-knowledge     (vector+FTS indexing + hybrid search over the docs)
#   - beds24-mcp-server    (MCP server + CLI bin; depends on the two above)
#
# The server declares its siblings as `workspace:*` dependencies. npm rewrites
# those to the concrete version at publish time, so all three MUST be published
# together in the same release for the server's deps to resolve for consumers.
# `npm publish --workspaces` topo-sorts the packages, so deps land first.
#
# Required secret:
#   NPM_TOKEN — an npm access token (Automation type, works with 2FA). Create it
#   at https://npmjs.com → Access Tokens → Generate New Token → Automation, then
#   add it at https://github.com/jverneuer/beds24-mcp/settings/secrets/actions.
#
# Required permission:
#   id-token: write  — lets npm attach provenance (links the package to this
#   GitHub Actions run). Optional; drop `--provenance` if you don't want it.

name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build (CLI + SDK + knowledge bundles)
        run: bun run build

      - name: Verify CLI bundle loads
        run: node dist/cli.mjs status

      - name: Test
        run: bun test

      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in packages/sdk packages/knowledge packages/server; do
            VER=$(node -p "require('./$pkg/package.json').version")
            if [ "$VER" != "$TAG" ]; then
              echo "ERROR: $pkg is at version $VER but tag is $TAG — they must match"
              exit 1
            fi
          done
          echo "All three packages at $TAG — versions match tag."

      # Publishing is disabled for now. To enable: add the NPM_TOKEN secret,
      # then uncomment the two steps below (auth + publish).
      #
      # - name: Configure npm auth
      #   run: |
      #     echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      #   env:
      #     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      #
      # - name: Publish workspace packages to npm
      #   run: npm publish --workspaces --access public --provenance
      #   env:
      #     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (disabled)
        run: echo "publish disabled — uncomment the publish steps in publish.yml to enable"
