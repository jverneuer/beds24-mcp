# One-off: deprecate the old unscoped package on npmjs with a redirect.
#
# Trigger: manual (Actions → Deprecate old package → Run workflow).
# Uses the same NPM_TOKEN secret as the publish workflow.
#
# After it runs successfully, delete this file — it's not needed again.

name: Deprecate old package

on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deprecate beds24-mcp-server (all versions)
        run: |
          npm deprecate beds24-mcp-server@">=0.0.0 <1.1.2" \
            "Renamed to @jverneuer/beds24-mcp-server — install the scoped package instead: npm i @jverneuer/beds24-mcp-server" \
            2>&1 || true
          # Also pin the specific published version, in case the range form is rejected.
          npm deprecate beds24-mcp-server@1.1.1 \
            "Renamed to @jverneuer/beds24-mcp-server — install the scoped package instead: npm i @jverneuer/beds24-mcp-server" \
            2>&1 || true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
