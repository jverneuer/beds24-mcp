# Release workspace packages to npm + GitHub Packages — one independent version per package.
#
# This is a 3-package npm-workspace monorepo. The root package is private and
# is NOT published. Each workspace package versions and publishes on its own:
#
#   - beds24-sdk-client    (typed V2 API client, schema introspection, validation)
#   - beds24-knowledge     (vector+FTS indexing + hybrid search over the docs)
#   - beds24-mcp-server    (MCP server + CLI bin; depends on the two above)
#
# How it works (Changesets):
#   - A PR that should bump a package ships a changeset (.changeset/*.md).
#   - On push to main, changesets/action opens/updates a "Version Packages" PR
#     that consumes any pending changesets and bumps the affected packages.
#     If no pending changesets remain, it publishes to npm directly.
#   - A separate step publishes to GitHub Packages (npm.pkg.github.com).
#
# The server declares its siblings as `workspace:*` dependencies. npm rewrites
# those to the concrete version at publish time; `updateInternalDependencies`
# in .changeset/config.json makes a dependency bump flow a patch to dependents.
#
# There is no shared version and no `v*.*.*` tag — each package carries its own
# semver and is released when its own changes go out.
#
# Authentication:
#   - npm: trusted publishing (OIDC) — no NPM_TOKEN secret needed. Configure a
#     trusted publisher at https://npmjs.com for each package:
#       Organization: jverneuer | Repo: beds24-mcp | Workflow: release.yml
#       Environment: release
#   - GitHub Packages: uses the automatic GITHUB_TOKEN.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write          # changesets/action creates/merges the Version Packages PR
  pull-requests: write     # same
  id-token: write          # npm trusted publishing (OIDC)

# Never run two releases against main at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release    # matches the trusted publisher environment on npmjs.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Build first so the server's typecheck can resolve @jverneuer/beds24-knowledge
      # and @jverneuer/beds24-sdk-client from their dist/.
      - name: Build (CLI + SDK + knowledge bundles)
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Verify CLI bundle loads
        run: node packages/server/dist/cli.mjs status

      - name: Test
        run: |
          # Bun exits with code 1 when open handles remain after all tests pass
          # (known issue with @huggingface/transformers native bindings on Linux).
          set +e
          bun test --isolate 2>&1 | tee /tmp/bun-test.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 1 ] && grep -q "0 fail" /tmp/bun-test.log; then
            echo "All tests passed (exit code 1 from open handles, not test failures)"
            exit 0
          fi
          exit "$code"

      # If pending changesets exist, this creates/updates the "Version Packages"
      # PR and does NOT publish. Once that PR merges (no pending changesets
      # left), the same step publishes the changed packages instead.
      #
      # Trusted publishing: changesets/action uses the GitHub OIDC token
      # automatically when id-token: write is granted and NPM_TOKEN is unset.
      # No NPM_TOKEN secret required.
      - name: Create Version Packages PR or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish to GitHub Packages. Packages are already scoped under
      # @jverneuer/*, so just pack and publish directly to npm.pkg.github.com.
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
          echo "@jverneuer:registry=https://npm.pkg.github.com" >> .npmrc

          for pkg_dir in packages/sdk packages/knowledge packages/server; do
            name=$(node -p "require('./$pkg_dir/package.json').name")
            version=$(node -p "require('./$pkg_dir/package.json').version")

            echo "Publishing $name@$version to GitHub Packages..."

            cd "$pkg_dir"
            npm publish --registry https://npm.pkg.github.com
            cd "$GITHUB_WORKSPACE"
          done
